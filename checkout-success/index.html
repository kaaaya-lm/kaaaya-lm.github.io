<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>お支払い完了 | LM攻略シミュレーター</title>
<style>
  :root {
    --primary-blue: #0075de;
    --sky-tint: #e6f3fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--sky-tint);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #1a1a1a;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    max-width: 420px;
    width: 100%;
    padding: 40px 28px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  }
  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--primary-blue);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 32px; height: 32px; }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 12px;
    color: var(--primary-blue);
  }
  p {
    font-size: 14px;
    line-height: 1.7;
    color: #444;
    margin: 0 0 8px;
  }
  .note {
    background: var(--sky-tint);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 20px 0;
    font-size: 13px;
    color: #333;
    text-align: left;
  }
  .btn {
    display: inline-block;
    margin-top: 12px;
    width: 100%;
    padding: 14px;
    background: var(--primary-blue);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    border-radius: 10px;
  }
  .btn:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>お支払いが完了しました</h1>
    <p>ご購入ありがとうございます。</p>
    <div class="note">
      反映まで数秒〜数十秒かかる場合があります。アプリに戻ってプラン状況をご確認ください。
    </div>
    <a class="btn" href="lmsimapp://" id="returnBtn">アプリに戻る</a>
  </div>
</body>
</html>
