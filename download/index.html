<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Lords Mobile（ロードモバイル／ローモバ）向け無料スマホアプリ「LM攻略シミュレーター」のAndroid版（APK）配布ページ。戦闘予測・装備最適化・アーティファクト効率表など9ツールを収録。 Download the free Lords Mobile companion app (Android APK).">
<style>
  :root {
    --primary-blue: #0075de;
    --sky-tint: #e6f3fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--sky-tint);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #1a1a1a;
    padding: 24px 16px 48px;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
  }
  .lang-switch {
    text-align: right;
    margin-bottom: 10px;
  }
  .lang-switch button {
    background: #fff;
    border: 1px solid var(--primary-blue);
    color: var(--primary-blue);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 14px;
    cursor: pointer;
  }
  .lang-switch button.active {
    background: var(--primary-blue);
    color: #fff;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    margin-bottom: 20px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--primary-blue);
  }
  .subtitle {
    font-size: 13px;
    color: #666;
    margin: 0 0 20px;
  }
  .version {
    display: inline-block;
    background: var(--sky-tint);
    color: var(--primary-blue);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: var(--primary-blue);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    border-radius: 10px;
  }
  .btn:active { opacity: 0.85; }
  .meta {
    font-size: 12px;
    color: #999;
    margin-top: 10px;
  }
  .ios-note {
    background: var(--sky-tint);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: #333;
    margin-bottom: 20px;
    text-align: center;
  }
  .ios-note a {
    color: var(--primary-blue);
    font-weight: 700;
    text-decoration: none;
  }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 14px;
    text-align: left;
  }
  .steps {
    text-align: left;
    padding: 0;
    margin: 0;
    list-style: none;
    counter-reset: step;
  }
  .steps li {
    counter-increment: step;
    position: relative;
    padding-left: 34px;
    margin-bottom: 14px;
    font-size: 14px;
    line-height: 1.6;
    color: #333;
  }
  .steps li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 0;
    width: 24px;
    height: 24px;
    background: var(--primary-blue);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .notice {
    background: var(--sky-tint);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.7;
    color: #333;
    text-align: left;
    margin-bottom: 20px;
  }
  .notice strong { color: var(--primary-blue); }
  .links {
    text-align: center;
    font-size: 12px;
    color: #888;
  }
  .links a {
    color: var(--primary-blue);
    text-decoration: none;
    margin: 0 8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="lang-switch">
      <button id="btnJa" onclick="setLang('ja')">日本語</button>
      <button id="btnEn" onclick="setLang('en')">English</button>
    </div>

    <div class="card">
      <h1 class="i18n" data-ja="LM攻略シミュレーター（Android版）" data-en="LM Strategy Simulator (Android)"></h1>
      <p class="subtitle i18n" data-ja="Lords Mobile向けの無料シミュレーションツール集" data-en="Free simulation tools for Lords Mobile players"></p>
      <div class="version">
        <span class="i18n" data-ja="最新バージョン: v1.0.7" data-en="Latest version: v1.0.7"></span>
      </div>
      <a class="btn" href="https://github.com/kaaaya-lm/kaaaya-lm.github.io/releases/download/v1.0.7-android/application-a51154f4-1f93-446c-bfe5-8ec6da79b631.apk" id="downloadBtn">
        <span class="i18n" data-ja="アプリをダウンロード" data-en="Download the App"></span>
      </a>
      <p class="meta i18n" data-ja="Google Play以外での配布です。ダウンロードには「提供元不明のアプリ」の許可が必要です。" data-en="Distributed outside Google Play. You'll need to allow installs from unknown sources."></p>
    </div>

    <div class="ios-note i18n"
      data-ja='iPhoneをお使いの方は <a href="https://apps.apple.com/app/id6804715419">App Storeからダウンロード</a> してください。'
      data-en='iPhone user? <a href="https://apps.apple.com/app/id6804715419">Get it on the App Store</a> instead.'>
    </div>

    <div class="card">
      <p class="section-title i18n" data-ja="インストール手順" data-en="Installation Steps"></p>
      <ol class="steps">
        <li class="i18n" data-ja="上のボタンからAPKファイルをダウンロードします。" data-en="Tap the button above to download the APK file."></li>
        <li class="i18n" data-ja="ダウンロード完了後、通知またはファイルをタップして開きます。" data-en="Once downloaded, tap the notification or the file to open it."></li>
        <li class="i18n" data-ja="「このソースからのアプリを許可しますか」と表示されたら、使用しているブラウザ（Chromeなど）を許可してください。" data-en='When prompted "Allow installs from this source", allow your browser (e.g. Chrome).'></li>
        <li class="i18n" data-ja="「インストール」をタップして完了です。" data-en='Tap "Install" to finish.'></li>
      </ol>
    </div>

    <div class="notice">
      <strong class="i18n" data-ja="これは公式の配布ページです。" data-en="This is the official distribution page."></strong><br>
      <span class="i18n"
        data-ja="本アプリはGoogle Playには公開しておらず、この公式サイトからのみ配布しています。他のサイトからダウンロードしたAPKにはご注意ください。"
        data-en="This app is not on Google Play and is distributed only from this official site. Please be cautious of APKs downloaded from other sources."></span>
    </div>

    <div class="links">
      <a href="https://respected-taxicab-8a1.notion.site/3c0ab2d2810a8195ac5ad62f5eb7f08a" class="i18n" data-ja="プライバシーポリシー" data-en="Privacy Policy"></a>
      <a href="https://respected-taxicab-8a1.notion.site/3c0ab2d2810a81c6b0ccd05eb4c8912c" class="i18n" data-ja="利用規約" data-en="Terms of Service"></a>
      <a href="https://respected-taxicab-8a1.notion.site/3c0ab2d2810a8188a5edda1d7623f640" class="i18n" data-ja="サポート" data-en="Support"></a>
      <a href="https://respected-taxicab-8a1.notion.site/3c3ab2d2810a81d09be9d4bdde96d3fa" class="i18n" data-ja="特定商取引法に基づく表記" data-en="Legal Notice"></a>
    </div>
  </div>

<script>
  function setLang(lang) {
    document.querySelectorAll('.i18n').forEach(function(el) {
      el.innerHTML = el.dataset[lang === 'ja' ? 'ja' : 'en'];
    });
    document.getElementById('btnJa').classList.toggle('active', lang === 'ja');
    document.getElementById('btnEn').classList.toggle('active', lang === 'en');
    document.documentElement.lang = lang;
    localStorage.setItem('lm_lang', lang);
  }
  (function() {
    var saved = localStorage.getItem('lm_lang');
    var lang = saved || (navigator.language && navigator.language.startsWith('ja') ? 'ja' : 'en');
    setLang(lang);
  })();
</script>
</body>
</html>
