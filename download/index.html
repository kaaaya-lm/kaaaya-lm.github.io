<script>
  // 新バージョン公開時は、この1行だけ書き換える（表示バージョンとAPKリンクの両方に反映される）
  var VERSION = '1.0.8';

  var LANGS = {
    'ja':    { key: 'ja', html: 'ja',      btn: 'btnJa' },
    'en':    { key: 'en', html: 'en',      btn: 'btnEn' },
    'zh-cn': { key: 'cn', html: 'zh-Hans', btn: 'btnCn' },
    'zh-tw': { key: 'tw', html: 'zh-Hant', btn: 'btnTw' }
  };
  function setLang(lang) {
    if (!LANGS[lang]) lang = 'en';
    var L = LANGS[lang];
    document.querySelectorAll('.i18n').forEach(function(el) {
      var t = el.dataset[L.key] || el.dataset.en;
      el.innerHTML = t.replace(/\{v\}/g, VERSION);
    });
    Object.keys(LANGS).forEach(function(k) {
      document.getElementById(LANGS[k].btn).classList.toggle('active', k === lang);
    });
    document.getElementById('downloadBtn').href =
      'https://github.com/kaaaya-lm/kaaaya-lm.github.io/releases/download/v' + VERSION + '-android/lm-sim-app-v' + VERSION + '.apk';
    document.documentElement.lang = L.html;
    try { localStorage.setItem('lm_lang', lang); } catch (e) {}
  }
  function detectLang() {
    var p = new URLSearchParams(location.search).get('lang');
    if (p && LANGS[p.toLowerCase()]) return p.toLowerCase();
    var saved = null;
    try { saved = localStorage.getItem('lm_lang'); } catch (e) {}
    if (saved && LANGS[saved]) return saved;
    var n = (navigator.language || '').toLowerCase();
    if (n.indexOf('ja') === 0) return 'ja';
    if (n.indexOf('zh') === 0) return /tw|hk|mo|hant/.test(n) ? 'zh-tw' : 'zh-cn';
    return 'en';
  }
  setLang(detectLang());
</script>
