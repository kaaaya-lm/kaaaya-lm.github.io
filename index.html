<script>
  function setLang(lang) {
    document.querySelectorAll('.i18n').forEach(function(el) {
      el.textContent = el.dataset[lang === 'ja' ? 'ja' : 'en'];
    });
    document.getElementById('btnJa').classList.toggle('active', lang === 'ja');
    document.getElementById('btnEn').classList.toggle('active', lang === 'en');
    document.documentElement.lang = lang;
    localStorage.setItem('lm_lang', lang);
  }
  (function() {
    var saved = localStorage.getItem('lm_lang');
    var lang = saved || (navigator.language && navigator.language.startsWith('ja') ? 'ja' : 'en');
    setLang(lang);
  })();
</script>
